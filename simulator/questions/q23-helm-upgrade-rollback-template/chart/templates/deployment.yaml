apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cka-app
  labels:
    app.kubernetes.io/name: cka-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cka-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cka-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: MESSAGE
              value: {{ .Values.message | quote }}
          ports:
            - containerPort: 80
